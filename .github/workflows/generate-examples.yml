name: Generate Trophy Examples

on:
  # schedule:
    # - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      # The action's own sources belong here now that the steps below run `./`
      # rather than a published tag: a change to action.yml or index.sh can
      # change what the examples look like, and if it does not start a run the
      # committed assets go stale exactly as they did on v1.0.0.
      - '.github/workflows/generate-examples.yml'
      - 'action.yml'
      - 'index.sh'

# Only the newest run may finish. Each run regenerates every asset from the
# sources at its own checkout, so a run started on an older commit is already
# superseded the moment a newer one begins -- and without this it could finish
# last and make its stale output the final state.
concurrency:
  group: generate-trophy-examples
  cancel-in-progress: true

# The action is invoked as `./` rather than by a published tag: this workflow
# runs on main and commits its output back to main, so the examples must show
# what this repository currently produces. Pinning to a release meant the
# assets were regenerated by whatever shipped earlier -- they sat on v1.0.0,
# predating both the SVG-sniff and the outputs.path fixes in v1.1.0.
jobs:
  generate:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate basic trophy
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}'
          path: .github/assets/trophy-basic.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy with theme
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=onedark'
          path: .github/assets/trophy-themed.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy filtered by titles
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&title=Stars,Followers'
          path: .github/assets/trophy-filtered-titles.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy filtered by ranks
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&rank=S,AAA'
          path: .github/assets/trophy-filtered-ranks.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate trophy with custom layout
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&column=3&row=2&margin-w=15&margin-h=15'
          path: .github/assets/trophy-custom-layout.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme default
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=default'
          path: .github/assets/theme-default.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme flat
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=flat'
          path: .github/assets/theme-flat.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme onedark
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=onedark'
          path: .github/assets/theme-onedark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme gruvbox
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=gruvbox'
          path: .github/assets/theme-gruvbox.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme dracula
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=dracula'
          path: .github/assets/theme-dracula.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme monokai
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=monokai'
          path: .github/assets/theme-monokai.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme chalk
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=chalk'
          path: .github/assets/theme-chalk.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme nord
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=nord'
          path: .github/assets/theme-nord.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme alduin
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=alduin'
          path: .github/assets/theme-alduin.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme darkhub
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=darkhub'
          path: .github/assets/theme-darkhub.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme juicyfresh
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=juicyfresh'
          path: .github/assets/theme-juicyfresh.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme oldie
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=oldie'
          path: .github/assets/theme-oldie.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme buddhism
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=buddhism'
          path: .github/assets/theme-buddhism.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme radical
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=radical'
          path: .github/assets/theme-radical.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme onestar
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=onestar'
          path: .github/assets/theme-onestar.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme discord
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=discord'
          path: .github/assets/theme-discord.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme algolia
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=algolia'
          path: .github/assets/theme-algolia.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme gitdimmed
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=gitdimmed'
          path: .github/assets/theme-gitdimmed.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme tokyonight
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=tokyonight'
          path: .github/assets/theme-tokyonight.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme matrix
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=matrix'
          path: .github/assets/theme-matrix.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme apprentice
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=apprentice'
          path: .github/assets/theme-apprentice.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme dark_dimmed
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=dark_dimmed'
          path: .github/assets/theme-dark_dimmed.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme dark_lover
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=dark_lover'
          path: .github/assets/theme-dark_lover.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme kimbie_dark
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=kimbie_dark'
          path: .github/assets/theme-kimbie_dark.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate theme aura
        uses: ./
        with:
          options: 'username=${{ github.repository_owner }}&theme=aura'
          path: .github/assets/theme-aura.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit trophy examples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/assets/trophy-*.svg .github/assets/theme-*.svg
          git diff --staged --quiet || git commit -m "Update trophy examples"

          # This job races the branch it pushes to. Generating 30 cards takes
          # most of a minute, and a merge landing in that window makes the push
          # a non-fast-forward -- which is exactly what happened on 3306772,
          # where #4 and #5 merged while the run begun by #6 was still going.
          if git push; then
            exit 0
          fi

          # Rejected, so main moved. What to do depends on WHY, and rebasing
          # blindly is wrong: `git pull --rebase` replays this commit, it does
          # not re-run the generation above. If the sources changed underneath
          # us, replaying would stamp assets built by the old action on top of
          # the new one -- the same staleness this workflow exists to prevent,
          # arriving by yet another route.
          echo "Push rejected; main moved during generation."
          git fetch origin main
          if ! git diff --quiet HEAD origin/main -- \
              action.yml index.sh .github/workflows/generate-examples.yml; then
            echo "::notice::generation sources changed on main during this run; discarding these assets, the newer run regenerates them."
            exit 0
          fi

          # Sources are unchanged, so what was generated is still correct and
          # only the branch tip moved. Replaying it is safe here.
          echo "Sources unchanged; rebasing onto the new tip and retrying."
          git pull --rebase origin main
          git push
